<text x="56" y="928" font-size="15" font-weight="bold" fill="#0f172a">Shared Validation Infrastructure</text>
<rect x="56" y="945" width="378" height="180" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
<text x="68" y="968" font-size="13" font-weight="bold" fill="#0f172a">[G]  Generic edit paragraphs</text>
<text x="68" y="988" font-size="11.5" fill="#1e293b">COACTUPC.cbl lines 1824–2223, driven by</text>
<text x="68" y="1005" font-size="11.5" fill="#1e293b">WS-EDIT-VARIABLE-NAME / …-ALPHANUM-LENGTH:</text>
<text x="68" y="1022" font-size="11.5" fill="#1e293b">1215-EDIT-MANDATORY, 1220-EDIT-YESNO,</text>
<text x="68" y="1039" font-size="11.5" fill="#1e293b">1225/1235-EDIT-ALPHA (reqd/opt),</text>
<text x="68" y="1056" font-size="11.5" fill="#1e293b">1230/1240-EDIT-ALPHANUM (reqd/opt),</text>
<text x="68" y="1073" font-size="11.5" fill="#1e293b">1245-EDIT-NUM-REQD,</text>
<text x="68" y="1090" font-size="11.5" fill="#1e293b">1250-EDIT-SIGNED-9V2 (TEST-NUMVAL-C)</text>
<rect x="446" y="945" width="378" height="180" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
<text x="458" y="968" font-size="13" font-weight="bold" fill="#0f172a">[D]  Date infrastructure</text>
<text x="458" y="988" font-size="11.5" fill="#1e293b">CSUTLDPY.cpy lines 18–372 (+ CSUTLDWY.cpy flags):</text>
<text x="458" y="1005" font-size="11.5" fill="#1e293b">EDIT-DATE-CCYYMMDD, EDIT-YEAR-CCYY (century</text>
<text x="458" y="1022" font-size="11.5" fill="#1e293b">19/20), EDIT-MONTH, EDIT-DAY,</text>
<text x="458" y="1039" font-size="11.5" fill="#1e293b">EDIT-DAY-MONTH-YEAR (leap-year Feb-29),</text>
<text x="458" y="1056" font-size="11.5" fill="#1e293b">EDIT-DATE-LE → CSUTLDTC.cbl (LE CEEDAYS</text>
<text x="458" y="1073" font-size="11.5" fill="#1e293b">real-date check), EDIT-DATE-OF-BIRTH</text>
<text x="458" y="1090" font-size="11.5" fill="#1e293b">(no future DOB). Also called by COTRN02C, CORPT00C</text>
<rect x="836" y="945" width="378" height="180" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
<text x="848" y="968" font-size="13" font-weight="bold" fill="#0f172a">[L]  Lookup tables — CSLKPCDY.cpy</text>
<text x="848" y="988" font-size="11.5" fill="#1e293b">VALID-PHONE-AREA-CODE (line 30) —</text>
<text x="848" y="1005" font-size="11.5" fill="#1e293b">North America general-purpose area codes</text>
<text x="848" y="1022" font-size="11.5" fill="#1e293b">VALID-GENERAL-PURP-CODE (line 521)</text>
<text x="848" y="1039" font-size="11.5" fill="#1e293b">VALID-US-STATE-CODE (line 1013)</text>
<text x="848" y="1056" font-size="11.5" fill="#1e293b">VALID-US-STATE-ZIP-CD2-COMBO (line 1073) —</text>
<text x="848" y="1073" font-size="11.5" fill="#1e293b">state + first-2-zip-digit combinations</text>
<rect x="1226" y="945" width="378" height="180" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
<text x="1238" y="968" font-size="13" font-weight="bold" fill="#0f172a">[K]  Shared key/field patterns</text>
<text x="1238" y="988" font-size="11.5" fill="#1e293b">Account ID: PIC 9(11), non-zero — COACTVWC,</text>
<text x="1238" y="1005" font-size="11.5" fill="#1e293b">COACTUPC, COCRDLIC/SLC/UPC, COTRN02C, COBIL00C</text>
