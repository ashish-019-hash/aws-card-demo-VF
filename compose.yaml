services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: carddemo
      POSTGRES_USER: carddemo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; set it in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carddemo -d carddemo']
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - '5432:5432'

  migrate:
    build: .
    command: ['node', 'dist/database/run-migrations.js']
    environment: &api-environment
      NODE_ENV: ${APP_NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://carddemo:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; set it in .env}@postgres:5432/carddemo
      DATABASE_SSL: 'false'
      CORS_ORIGINS: http://localhost:3000
      CURSOR_SECRET: ${CURSOR_SECRET:?CURSOR_SECRET is required and must be at least 32 characters}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required and must be at least 32 characters}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-900}
      REPORT_TIMESTAMP_MODE: ${REPORT_TIMESTAMP_MODE:-processed-or-original}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build: .
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:3000/api/v1/health/live'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  report-worker:
    build: .
    command: ['node', 'dist/worker.js']
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  seed-dev:
    build: .
    command: ['node', 'dist/cli/seed-dev.js']
    profiles: ['tools']
    environment:
      <<: *api-environment
      SEED_ALLOW_UNSAFE: ${SEED_ALLOW_UNSAFE:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

volumes:
  postgres-data:
