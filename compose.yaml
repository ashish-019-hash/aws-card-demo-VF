services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: carddemo
      POSTGRES_USER: carddemo
      POSTGRES_PASSWORD: carddemo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carddemo -d carddemo']
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - '5432:5432'

  migrate:
    build: .
    command: ['node', 'dist/database/run-migrations.js']
    environment: &api-environment
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://carddemo:carddemo@postgres:5432/carddemo
      DATABASE_SSL: 'false'
      CORS_ORIGINS: http://localhost:3000
      CURSOR_SECRET: change-me-to-a-long-random-cursor-secret
      JWT_SECRET: change-me-to-a-long-random-jwt-secret
      REPORT_TIMESTAMP_MODE: processed-or-original
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build: .
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:3000/api/v1/health/live'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  report-worker:
    build: .
    command: ['node', 'dist/worker.js']
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
