services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: carddemo
      POSTGRES_USER: carddemo
      POSTGRES_PASSWORD: carddemo_local_only
    ports:
      - "5432:5432"
    volumes:
      - carddemo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carddemo -d carddemo"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  carddemo-postgres:
