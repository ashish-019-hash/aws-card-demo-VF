openapi: 3.0.3
info:
  title: CardDemo Express Migration API
  version: 1.1.0
  description: Session-authenticated Express migration. U accesses business routes; A accesses only user administration. Reports finish synchronously.
servers: [{ url: http://localhost:3000 }]
tags: [{ name: auth }, { name: business }, { name: admin }]
paths:
  /health: { get: { responses: { '200': { description: Healthy } } } }
  /api/auth/sign-in:
    post: { tags: [auth], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SignIn' } } } }, responses: { '200': { description: Session established }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' } } }
  /api/auth/sign-out: { post: { tags: [auth], security: [{ sessionCookie: [] }], responses: { '204': { description: Signed out } } } }
  /api/auth/me: { get: { tags: [auth], security: [{ sessionCookie: [] }], responses: { '200': { description: Session identity } } } }
  /api/menu: { get: { security: [{ sessionCookie: [] }], responses: { '200': { description: Role-specific menu } } } }
  /api/accounts/{accountId}:
    parameters: [{ $ref: '#/components/parameters/AccountId' }]
    get: { security: [{ sessionCookie: [] }], responses: { '200': { description: Joined account view, headers: { ETag: { $ref: '#/components/headers/ETag' } } } } }
    patch: { security: [{ sessionCookie: [] }], parameters: [{ $ref: '#/components/parameters/IfMatch' }], requestBody: { $ref: '#/components/requestBodies/Json' }, responses: { '200': { description: Updated }, '412': { $ref: '#/components/responses/Error' }, '428': { $ref: '#/components/responses/Error' } } }
  /api/accounts/{accountId}/customers/{customerId}:
    parameters: [{ $ref: '#/components/parameters/AccountId' }, { name: customerId, in: path, required: true, schema: { type: string, pattern: '^\\d{9}$' } }]
    get: { security: [{ sessionCookie: [] }], responses: { '200': { description: Masked customer, headers: { ETag: { $ref: '#/components/headers/ETag' } } } } }
    patch: { security: [{ sessionCookie: [] }], parameters: [{ $ref: '#/components/parameters/IfMatch' }], requestBody: { $ref: '#/components/requestBodies/Json' }, responses: { '200': { description: Updated } } }
  /api/cards:
    get: { security: [{ sessionCookie: [] }], parameters: [{ name: accountId, in: query, schema: { type: string } }, { name: cardNumber, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/CardLimit' }], responses: { '200': { description: Seven-row default exclusive cursor page; invalid cursors return 400 INVALID_CURSOR } } }
  /api/cards/{cardNumber}:
    parameters: [{ name: cardNumber, in: path, required: true, schema: { type: string, pattern: '^\\d{16}$' } }]
    get: { security: [{ sessionCookie: [] }], responses: { '200': { description: Card without CVV, headers: { ETag: { $ref: '#/components/headers/ETag' } } } } }
    patch: { security: [{ sessionCookie: [] }], parameters: [{ $ref: '#/components/parameters/IfMatch' }], requestBody: { $ref: '#/components/requestBodies/Json' }, responses: { '200': { description: Updated } } }
  /api/lookup/transaction-types: { get: { security: [{ sessionCookie: [] }], responses: { '200': { description: Imported type lookup } } } }
  /api/lookup/transaction-categories: { get: { security: [{ sessionCookie: [] }], parameters: [{ name: typeCode, in: query, schema: { type: string, pattern: '^\\d{2}$' } }], responses: { '200': { description: Imported category lookup } } } }
  /api/transactions:
    get: { security: [{ sessionCookie: [] }], parameters: [{ name: accountId, in: query, schema: { type: string } }, { name: cardNumber, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }], responses: { '200': { description: Ten-row default exclusive cursor page; invalid cursors return 400 INVALID_CURSOR } } }
    post: { security: [{ sessionCookie: [] }], parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { $ref: '#/components/requestBodies/Json' }, responses: { '201': { description: Transaction stored; account balance is intentionally unchanged per COTRN02C }, '200': { description: Idempotent replay }, '409': { $ref: '#/components/responses/Error' } } }
  /api/transactions/{transactionId}: { get: { security: [{ sessionCookie: [] }], parameters: [{ name: transactionId, in: path, required: true, schema: { type: string, pattern: '^\\d{16}$' } }], responses: { '200': { description: Transaction detail. Timestamps use UTC YYYY-MM-DD HH:MM:SS.ffffff; blank processedAt is an empty string. } } } }
  /api/billing/{accountId}/preview: { get: { security: [{ sessionCookie: [] }], parameters: [{ $ref: '#/components/parameters/AccountId' }], responses: { '200': { description: Full-balance preview, headers: { ETag: { $ref: '#/components/headers/ETag' } } } } } }
  /api/billing/{accountId}/pay-full-balance: { post: { security: [{ sessionCookie: [] }], parameters: [{ $ref: '#/components/parameters/AccountId' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { $ref: '#/components/requestBodies/Json' }, responses: { '201': { description: Payment and updated account, headers: { ETag: { $ref: '#/components/headers/ETag' } } }, '200': { description: Idempotent replay }, '409': { $ref: '#/components/responses/Error' } } } }
  /api/reports: { post: { security: [{ sessionCookie: [] }], requestBody: { $ref: '#/components/requestBodies/Json' }, responses: { '201': { description: Immediately completed report } } } }
  /api/reports/{reportId}: { get: { security: [{ sessionCookie: [] }], parameters: [{ name: reportId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Owner-only status }, '403': { $ref: '#/components/responses/Error' } } } }
  /api/reports/{reportId}/content: { get: { security: [{ sessionCookie: [] }], parameters: [{ name: reportId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Owner-only text content, content: { text/plain: { schema: { type: string } } } } } } }
  /api/admin/users:
    get: { security: [{ sessionCookie: [] }], parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }], responses: { '200': { description: A-only ten-row user page } } }
    post: { security: [{ sessionCookie: [] }], requestBody: { $ref: '#/components/requestBodies/Json' }, responses: { '201': { description: User created } } }
  /api/admin/users/{userId}:
    parameters: [{ name: userId, in: path, required: true, schema: { type: string, pattern: '^[A-Z0-9]{3,8}$' } }]
    get: { security: [{ sessionCookie: [] }], responses: { '200': { description: User, headers: { ETag: { $ref: '#/components/headers/ETag' } } } } }
    patch: { security: [{ sessionCookie: [] }], parameters: [{ $ref: '#/components/parameters/IfMatch' }], requestBody: { $ref: '#/components/requestBodies/Json' }, responses: { '200': { description: Updated } } }
    delete: { security: [{ sessionCookie: [] }], parameters: [{ $ref: '#/components/parameters/IfMatch' }], responses: { '204': { description: Deleted } } }
components:
  securitySchemes: { sessionCookie: { type: apiKey, in: cookie, name: carddemo.sid } }
  headers: { ETag: { schema: { type: string }, description: Send this value in If-Match for mutable resources. } }
  parameters:
    AccountId: { name: accountId, in: path, required: true, schema: { type: string, pattern: '^\\d{11}$' } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
    Cursor: { name: cursor, in: query, description: Exclusive cursor from the matching filtered result set; malformed or nonmatching values return 400 INVALID_CURSOR., schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
    CardLimit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 7 } }
  requestBodies: { Json: { required: true, content: { application/json: { schema: { type: object } } } } }
  schemas:
    SignIn: { type: object, required: [userId, password], properties: { userId: { type: string }, password: { type: string, format: password } } }
    Error: { type: object, properties: { error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string }, details: {} } } } }
  responses: { Error: { description: API error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
