spring:
  application:
    name: carddemo-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/carddemo
    username: carddemo
    password: carddemo
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    timeout: 30m

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

carddemo:
  seed:
    enabled: false
  security:
    csrf-cookie-secure: true
  cors:
    allowed-origins: http://localhost:5173

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.carddemo.backend: INFO
